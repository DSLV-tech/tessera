<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241811"/>
      <stop offset="0.55" stop-color="#16100a"/>
      <stop offset="1" stop-color="#0d0906"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e9d4"/>
      <stop offset="0.6" stop-color="#e6d8ba"/>
      <stop offset="1" stop-color="#d3c19c"/>
    </linearGradient>
    <radialGradient id="stone" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4a3524"/>
      <stop offset="0.75" stop-color="#2f2015"/>
      <stop offset="1" stop-color="#17100a"/>
    </radialGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16302a"/>
      <stop offset="1" stop-color="#10201b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="86" y="86" width="340" height="340" rx="40" fill="url(#felt)" stroke="#000" stroke-opacity="0.4"/>
  <g>
    <!-- 3x3 griglia di tessere -->
    <g fill="url(#tile)">
      <rect x="112" y="112" width="86" height="86" rx="12"/>
      <rect x="213" y="112" width="86" height="86" rx="12"/>
      <rect x="314" y="112" width="86" height="86" rx="12"/>
      <rect x="112" y="213" width="86" height="86" rx="12"/>
      <rect x="314" y="213" width="86" height="86" rx="12"/>
      <rect x="112" y="314" width="86" height="86" rx="12"/>
      <rect x="213" y="314" width="86" height="86" rx="12"/>
      <rect x="314" y="314" width="86" height="86" rx="12"/>
    </g>
    <!-- pedina centrale -->
    <circle cx="256" cy="256" r="52" fill="url(#stone)"/>
    <circle cx="238" cy="238" r="14" fill="#fff" fill-opacity="0.18"/>
    <!-- accenti ottone: valori -->
    <g fill="#8a6c14" font-family="Georgia, serif" font-weight="700" font-size="46" text-anchor="middle">
      <text x="155" y="170">2</text>
      <text x="357" y="170">2</text>
      <text x="155" y="372">2</text>
      <text x="357" y="372">2</text>
    </g>
  </g>
</svg>
